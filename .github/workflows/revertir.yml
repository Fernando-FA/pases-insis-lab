# Revierte pases de una etiqueta en un ambiente (sección 7 de la guía): solo a pedido de desarrollo, con los scripts
# ROLLBACK, en orden inverso y sin dejar dependientes aplicados huérfanos. Aprobación separada: <ambiente>-rollback.
# En QA solo se revierte lo que no está aplicado en PRD (QA tiene siempre al menos lo que tiene PRD).
name: Revertir pases
run-name: "revertir ${{ inputs.ambiente }} · ${{ github.ref_name }} · ${{ inputs.pases }}"

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        type: choice
        options: [qa, prd]
        required: true
      pases:
        description: Pases a revertir, separados por espacio (ej. 0004-10004 0002-10002)
        type: string
        required: true
      numero_cambio:
        description: Número de cambio ITSM (obligatorio en PRD)
        type: string
        required: false

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  verificar:
    name: Verificar pedido
    runs-on: ubuntu-latest
    outputs:
      entrega: ${{ steps.etiqueta.outputs.entrega }}
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      NUMERO_CAMBIO: ${{ inputs.numero_cambio }}
      PASES: ${{ inputs.pases }}
    steps:
      - name: Etiqueta liberada, pases y número de cambio
        id: etiqueta
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^rel-QA-([A-Z0-9]+)-[0-9]{8}(-[0-9]+)?$ ]]; then
            echo "::error title=Etiqueta::Se revierte desde una etiqueta liberada rel-QA-* (se lanzó sobre ${REF_NAME})"
            exit 1
          fi
          echo "entrega=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [ -z "${PASES// /}" ]; then echo "::error::Indicar los pases a revertir"; exit 1; fi
          if [ "${{ inputs.ambiente }}" = "prd" ] && [ -z "${NUMERO_CAMBIO// /}" ]; then
            echo "::error title=Número de cambio::PRD exige número de cambio ITSM"
            exit 1
          fi
          { echo "## Reversión pedida · ${{ inputs.ambiente }}"; echo; echo "Etiqueta \`${REF_NAME}\` · pases: **${PASES}**"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: inputs.ambiente == 'qa'

      - name: QA no revierte lo que está en PRD
        if: inputs.ambiente == 'qa'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra pases <<< "$PASES"
          tools/ci/verificar-prd.sh "${pases[@]}"

  revertir:
    name: Revertir en ${{ inputs.ambiente }}
    needs: verificar
    environment: ${{ inputs.ambiente }}-rollback
    runs-on: [self-hosted, insis-db, "${{ inputs.ambiente }}"]
    concurrency:
      group: pases-bd-${{ inputs.ambiente }}
      cancel-in-progress: false
    env:
      ENTREGA: ${{ needs.verificar.outputs.entrega }}
      PASES_DB_USER: ${{ vars.PASES_DB_USER }}
      PASES_DB_DSN: ${{ vars.PASES_DB_DSN }}
      PASES_DB_PASSWORD: ${{ secrets.PASES_DB_PASSWORD }}
      PASES_ESQUEMA_CONTROL: ${{ vars.PASES_ESQUEMA_CONTROL }}
      PASES_CLIENTE: ${{ vars.PASES_CLIENTE || 'sql' }}
      PASES_NUMERO_CAMBIO: ${{ inputs.numero_cambio }}
      PASES_REVERTIR: ${{ inputs.pases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Etiqueta anotada local
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Entorno Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r tools/pases/requirements.txt

      - name: Revertir pases
        run: |
          read -ra pases <<< "$PASES_REVERTIR"
          .venv/bin/python tools/pases/pases.py revertir \
            --manifiesto "releases/${ENTREGA}/manifest.yaml" \
            --ambiente "${{ inputs.ambiente }}" \
            --etiqueta "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --evidencia "$RUNNER_TEMP/evidencia" \
            --pases "${pases[@]}"

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-rollback-${{ inputs.ambiente }}-${{ github.ref_name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidencia
          if-no-files-found: warn
          retention-days: 90

      - name: Limpiar
        if: always()
        run: rm -rf "$RUNNER_TEMP/evidencia" DB/Releases
