# Fija la versión de una entrega (Anexo B de la guía): etiqueta anotada rel-QA-<ENTREGA>-<AAAAMMDD>[-N]
# sobre el HEAD de Desa, solo si la compuerta pasa. Esa MISMA etiqueta es la que después se instala en PRD.
# La verificación corre ANTES de pedir la aprobación del environment `liberacion`.
# Al publicar la etiqueta lanza solo el despliegue en QA, que queda esperando la aprobación de `qa`.
name: Liberar entrega
run-name: "liberar ${{ inputs.entrega }}"

on:
  workflow_dispatch:
    inputs:
      entrega:
        description: Entrega (carpeta releases/<entrega>)
        type: string
        default: B1
        required: true
      alcance:
        description: Alcance de la entrega (va en el mensaje de la etiqueta)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: liberar-entrega
  cancel-in-progress: false

env:
  ENTREGA: ${{ inputs.entrega }}

jobs:
  verificar:
    name: Verificar entrega
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Solo desde Desa
        if: github.ref != 'refs/heads/Desa'
        run: |
          echo "::error::La liberación se lanza desde Desa (se lanzó desde ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pases/requirements.txt

      - name: Dependencias
        run: pip install -r tools/pases/requirements.txt

      - name: Commit a liberar
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sin cambios no hay etiqueta nueva
        run: |
          ya=$(git tag -l "rel-QA-${ENTREGA}-*" --points-at HEAD --sort=v:refname | tail -1)
          if [ -n "$ya" ]; then
            echo "::error title=Sin cambios::Desa no cambió desde ${ya} (mismo commit $(git rev-parse --short HEAD)). Se instala esa etiqueta; no se crea otra."
            exit 1
          fi

      - name: Compuerta sobre el commit
        run: python tools/pases/pases.py validar --manifiesto "releases/${ENTREGA}/manifest.yaml"

  liberar:
    name: Liberar
    needs: verificar
    runs-on: ubuntu-latest
    environment: liberacion
    permissions:
      contents: write
      actions: write
    env:
      SHA: ${{ needs.verificar.outputs.sha }}
      ALCANCE: ${{ inputs.alcance }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.verificar.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pases/requirements.txt

      - name: Dependencias
        run: pip install -r tools/pases/requirements.txt

      - name: Crear y publicar la etiqueta anotada
        run: |
          python tools/pases/pases.py validar --manifiesto "releases/${ENTREGA}/manifest.yaml" > "$RUNNER_TEMP/compuerta.md"
          etq=$(python tools/pases/pases.py siguiente-etiqueta --ambiente qa --entrega "$ENTREGA")
          {
            echo "Entrega ${ENTREGA}"
            echo
            echo "Liberada por: ${ACTOR}"
            echo "Commit: ${SHA}"
            if [ -n "$ALCANCE" ]; then echo "Alcance: ${ALCANCE}"; fi
            echo "Se instala en QA y, una vez completa en QA, esta misma etiqueta se instala en PRD."
            echo
            cat "$RUNNER_TEMP/compuerta.md"
          } > "$RUNNER_TEMP/mensaje.txt"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR}@users.noreply.github.com"
          git tag -a "$etq" "$SHA" --cleanup=verbatim -F "$RUNNER_TEMP/mensaje.txt"
          git push origin "refs/tags/${etq}"
          git ls-remote --tags origin "$etq"
          echo "etiqueta=${etq}" >> "$GITHUB_ENV"
          {
            echo "## Etiqueta publicada: \`${etq}\`"
            echo
            echo "Commit \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lanzar el despliegue en QA (queda esperando aprobación)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run desplegar.yml --ref "$etiqueta" -f ambiente=qa
          echo "Despliegue en QA lanzado: aprobar \`qa\` en Actions → Desplegar pases (\`${etiqueta}\`)." >> "$GITHUB_STEP_SUMMARY"
