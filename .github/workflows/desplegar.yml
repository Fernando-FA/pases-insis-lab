# Instala una etiqueta en un ambiente (secciones 4 a 8 de la guía).
# Se lanza SIEMPRE sobre una etiqueta rel-QA-*. PRD instala la MISMA etiqueta que ya se desplegó completa en QA.
# QA se lanza solo al terminar `liberar.yml`; PRD se lanza a mano con el número de cambio.
# El paquete manual está en paquete.yml. La reversión no tiene workflow por ahora: se hace a mano con la guía.
name: Desplegar pases
run-name: "desplegar ${{ inputs.ambiente }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        type: choice
        options: [qa, prd]
        required: true
      numero_cambio:
        description: Número de cambio ITSM (obligatorio en PRD)
        type: string
        required: false
      reintentar:
        description: Excepcional - pases que fallaron con esta misma etiqueta y CTI autoriza reintentar sin corrección
        type: string
        required: false

permissions:
  contents: read
  deployments: read

jobs:
  verificar:
    name: Verificar etiqueta
    runs-on: ubuntu-latest
    outputs:
      entrega: ${{ steps.etiqueta.outputs.entrega }}
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      NUMERO_CAMBIO: ${{ inputs.numero_cambio }}
    steps:
      - name: Se ejecuta una etiqueta liberada, nunca una rama
        id: etiqueta
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error title=Etiqueta::Se ejecuta una etiqueta, nunca una rama (se lanzó sobre ${REF_NAME})"
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^rel-QA-([A-Z0-9]+)-[0-9]{8}(-[0-9]+)?$ ]]; then
            echo "::error title=Etiqueta::${REF_NAME} no es una etiqueta liberada rel-QA-<ENTREGA>-<AAAAMMDD>[-N] (QA y PRD instalan la misma)"
            exit 1
          fi
          echo "entrega=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Número de cambio (PRD)
        if: inputs.ambiente == 'prd'
        run: |
          if [ -z "${NUMERO_CAMBIO// /}" ]; then
            echo "::error title=Número de cambio::PRD exige número de cambio ITSM"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Promoción - el commit se desplegó completo en QA
        if: inputs.ambiente == 'prd'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/verificar-qa.sh "$GITHUB_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pases/requirements.txt

      - name: Qué se instala (resumen para quien aprueba)
        env:
          ENTREGA: ${{ steps.etiqueta.outputs.entrega }}
        run: |
          pip install -q -r tools/pases/requirements.txt
          anterior=$(git tag -l "rel-QA-${ENTREGA}-*" --sort=v:refname | grep -B1 -x "$REF_NAME" | grep -vx "$REF_NAME" || true)
          python tools/pases/pases.py resumen --manifiesto "releases/${ENTREGA}/manifest.yaml" \
            --ambiente "${{ inputs.ambiente }}" --etiqueta "$REF_NAME" ${anterior:+--anterior "$anterior"}
          if [ -n "${NUMERO_CAMBIO// /}" ]; then echo -e "\nNúmero de cambio: **${NUMERO_CAMBIO}**" >> "$GITHUB_STEP_SUMMARY"; fi

  ejecutar:
    name: Ejecutar en ${{ inputs.ambiente }}
    needs: verificar
    environment: ${{ inputs.ambiente }}
    runs-on: [self-hosted, insis-db, "${{ inputs.ambiente }}"]
    concurrency:
      group: pases-bd-${{ inputs.ambiente }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENTREGA: ${{ needs.verificar.outputs.entrega }}
      PASES_DB_USER: ${{ vars.PASES_DB_USER }}
      PASES_DB_DSN: ${{ vars.PASES_DB_DSN }}
      PASES_DB_PASSWORD: ${{ secrets.PASES_DB_PASSWORD }}
      PASES_ESQUEMA_CONTROL: ${{ vars.PASES_ESQUEMA_CONTROL }}
      PASES_CLIENTE: ${{ vars.PASES_CLIENTE || 'sql' }}
      PASES_NUMERO_CAMBIO: ${{ inputs.numero_cambio }}
      REINTENTAR: ${{ inputs.reintentar }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Etiqueta anotada local
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Clave desde Key Vault (opcional)
        if: vars.AZURE_KEYVAULT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Leer secreto de Key Vault (opcional)
        if: vars.AZURE_KEYVAULT != ''
        run: |
          clave=$(az keyvault secret show --vault-name "${{ vars.AZURE_KEYVAULT }}" --name pases-insis-db --query value -o tsv)
          echo "::add-mask::${clave}"
          echo "PASES_DB_PASSWORD=${clave}" >> "$GITHUB_ENV"

      - name: Entorno Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r tools/pases/requirements.txt

      - name: Ejecutar pases
        run: |
          extra=()
          if [ -n "${REINTENTAR// /}" ]; then read -ra r <<< "$REINTENTAR"; extra=(--reintentar "${r[@]}"); fi
          .venv/bin/python tools/pases/pases.py ejecutar \
            --manifiesto "releases/${ENTREGA}/manifest.yaml" \
            --ambiente "${{ inputs.ambiente }}" \
            --etiqueta "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --evidencia "$RUNNER_TEMP/evidencia" \
            "${extra[@]}"

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-${{ inputs.ambiente }}-${{ github.ref_name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidencia
          if-no-files-found: warn
          retention-days: 90

      - name: Evidencia a Blob Storage (opcional)
        if: always() && vars.AZURE_STORAGE_ACCOUNT != ''
        run: >
          az storage blob upload-batch --auth-mode login --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}"
          --destination evidencia-pases --destination-path "${{ inputs.ambiente }}/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}"
          --source "$RUNNER_TEMP/evidencia"

      - name: Limpiar
        if: always()
        run: rm -rf "$RUNNER_TEMP/evidencia" DB/Releases
